data:
  dataset_yaml: ./data/dataset.yaml

model:
  num_classes: 3
  pretrained: ./outputs/farmland_finetune_v8/weights/best.pt
  model_scale: s

training:
  epochs: 30
  batch_size: 2
  image_size: [800, 800]
  lr: 0.00004
  min_lr: 0.000004
  weight_decay: 0.0005
  num_workers: 0
  grad_clip_norm: 10.0
  mosaic_prob: 0.0

  optimizer:
    type: AdamW
    betas: [0.9, 0.999]

  scheduler:
    type: CosineAnnealingLR
    warmup_epochs: 3
    warmup_lr: 0.000008

  loss:
    box_loss_weight: 2.5
    cls_loss_weight: 3.0
    dfl_loss_weight: 1.5
    focal_gamma: 2.0
    focal_alpha: 0.25
    label_smoothing: 0.05

  amp:
    enabled: true
    init_scale: 65536.0
    growth_factor: 2.0
    backoff_factor: 0.5
    growth_interval: 2000

  gradient_accumulation:
    enabled: true
    steps: 4

  sampling:
    enabled: true
    background_weight: 0.15
    power: 1.15
    class_boosts: [1.0, 2.5, 4.0]
    use_box_frequency: true
    min_weight: 0.30

  ema:
    enabled: true
    decay: 0.999

  evaluation:
    period: 3
    conf_threshold: 0.25
    map_conf_threshold: 0.05
    iou_threshold: 0.5

output:
  dir: ./outputs/farmland_finetune_v9c
  save_period: 3
  log_interval: 20
